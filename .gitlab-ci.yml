# Generated by Suite Builder for https://the-internet.herokuapp.com. EDIT RULES: edit only inside YOURS blocks; regenerating keeps them and rewrites the rest of this file.
# GitLab CI: on every push and pull request, the quick check (http and smoke, in chromium): a site
# that is down or a page type that no longer opens fails in a minute or two. When started by hand (no nightly
# run: its schedule is off), every test, once in each of chromium and firefox. The results and any failure's
# evidence are kept with each run. Another copy of the site (a staging server): set BASE_URL.
# No nightly run; for one, a pipeline schedule (Build > Pipeline schedules), at 23 3 * * * UTC say. BASE_URL: a CI/CD variable.
# Cypress's own image, of the version this suite uses: Node, Cypress, Chrome and Firefox, ready.
default:
  image:
    name: cypress/included:16.1.1
    entrypoint: ['']
quick:
  # Judge the commit: a tree with changes fails SR-23 here, where a plain test run only warns.
  variables:
    SUITE_JUDGE: commit
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - npm ci
    - npm test -- --spec cypress/e2e/cases/links.cy.ts,cypress/e2e/cases/smoke.cy.ts --browser chrome --reporter junit --reporter-options "mochaFile=cypress/results/[hash].xml"
  artifacts:
    name: quick
    when: always
    expire_in: 2 weeks
    paths:
      - cypress/report.html
      - cypress/failures/
    reports:
      junit: cypress/results/*.xml
full:
  # Judge the commit: a tree with changes fails SR-23 here, where a plain test run only warns.
  variables:
    SUITE_JUDGE: commit
  rules:
    - if: $SUITE_JOB == "stories"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  parallel:
    matrix:
      - BROWSER: chrome
      - BROWSER: firefox
  script:
    - npm ci
    - npm test -- --browser $BROWSER --reporter junit --reporter-options "mochaFile=cypress/results/[hash].xml"
  artifacts:
    name: full-$BROWSER
    when: always
    expire_in: 2 weeks
    paths:
      - cypress/report.html
      - cypress/failures/
    reports:
      junit: cypress/results/*.xml
# The stories jobs: a pipeline trigger (Jira Automation) or a schedule with SUITE_JOB=stories. Three jobs:
# claim and publish hold the Jira token and SUITE_PUSH_TOKEN (a project access token that may push); the crew's
# job holds ANTHROPIC_API_KEY alone. CI/CD variables reach every job unless scoped: scope JIRA_API_TOKEN, JIRA_EMAIL
# and SUITE_PUSH_TOKEN to the environment "jira" and ANTHROPIC_API_KEY to the environment "crew" (Settings > CI/CD >
# Variables > Environment scope; the suite's own quick and full jobs are in neither, so they are given none), and mask them.
# The crew's job stops, changing nothing, when it is given one of the others; GitLab's own
# job token and the address that holds it, which every job is given, its script drops before the crew starts.
stories-claim:
  rules:
    - if: $SUITE_JOB == "stories"
  image: node:20
  environment:
    name: jira
    action: access
  variables:
    GIT_STRATEGY: clone
    SUITE_GIT_TOKEN: $SUITE_PUSH_TOKEN
    SUITE_GIT_USER: oauth2
  script:
    - git remote set-url origin "https://$CI_SERVER_HOST/$CI_PROJECT_PATH.git"
    - node jira-loop/agents.mjs claim
  artifacts:
    paths: [jira-loop/run/claimed.json]
    expire_in: 1 day
stories-crew:
  rules:
    - if: $SUITE_JOB == "stories"
  needs: [stories-claim]
  image: node:20
  environment:
    name: crew
    action: access
  variables:
    SUITE_AGENT: agent-1
  script:
    - bash jira-loop/stories.sh
  artifacts:
    when: always
    paths: [jira-loop/run/upload/*.bundle]
    expire_in: 1 day
stories-publish:
  rules:
    - if: $SUITE_JOB == "stories"
      when: always
  needs: [stories-claim, stories-crew]
  image: node:20
  timeout: 1h
  environment:
    name: jira
    action: access
  variables:
    GIT_STRATEGY: clone
    SUITE_GIT_TOKEN: $SUITE_PUSH_TOKEN
    SUITE_GIT_USER: oauth2
    SUITE_PUSH_OPTIONS: "merge_request.create\nmerge_request.target=$CI_DEFAULT_BRANCH\nmerge_request.title={key}: {title}"
  script:
    - git remote set-url origin "https://$CI_SERVER_HOST/$CI_PROJECT_PATH.git"
    - node jira-loop/agents.mjs publish jira-loop/run/upload/*.bundle
