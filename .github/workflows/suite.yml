# Generated by Suite Builder for https://the-internet.herokuapp.com. EDIT RULES: edit only inside YOURS blocks; regenerating keeps them and rewrites the rest of this file.
# GitHub Actions: on every push and pull request, the quick check (http and smoke, in chromium): a site
# that is down or a page type that no longer opens fails in a minute or two. When started by hand (no nightly
# run: its schedule is off), every test, once in each of chromium and firefox. The results and any failure's
# evidence are kept with each run. Another copy of the site (a staging server): set BASE_URL.
name: Suite
on:
  push:
  pull_request:
  workflow_dispatch:
  # ==== YOURS (schedule): safe to edit; regenerating keeps what is between these lines ====
  # Off: no nightly run. To run it, take the "# " off the lines below (the time is UTC).
  # schedule:
  #   - cron: '23 3 * * *'
  # ==== END YOURS (schedule) ====
# The least power that works: the repository read, nothing more.
permissions:
  contents: read
env:
  # ==== YOURS (env): safe to edit; regenerating keeps what is between these lines ====
  # Another copy of the site: a repository variable BASE_URL (Settings > Variables); unset, the crawled site.
  BASE_URL: ${{ vars.BASE_URL }}
  # ==== END YOURS (env) ====
jobs:
  quick:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Judge the commit: a tree with changes fails SR-23 here, where a plain test run only warns.
    env:
      SUITE_JUDGE: commit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm ci
      - run: npx cypress install
      - run: npm test -- --spec cypress/e2e/cases/links.cy.ts,cypress/e2e/cases/smoke.cy.ts --browser chrome --reporter junit --reporter-options "mochaFile=cypress/results/[hash].xml"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quick
          if-no-files-found: ignore
          path: |
            cypress/results/*.xml
            cypress/report.html
            cypress/failures/
  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Judge the commit: a tree with changes fails SR-23 here, where a plain test run only warns.
    env:
      SUITE_JUDGE: commit
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm ci
      - run: npx cypress install
      - run: npm test -- --browser ${{ matrix.browser }} --reporter junit --reporter-options "mochaFile=cypress/results/[hash].xml"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-${{ matrix.browser }}
          if-no-files-found: ignore
          path: |
            cypress/results/*.xml
            cypress/report.html
            cypress/failures/
  # ==== YOURS (jobs): safe to edit; regenerating keeps what is between these lines ====
  # ==== END YOURS (jobs) ====
